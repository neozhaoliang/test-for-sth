name: One-off Xueqiu Linux no-desktop access probe

on:
  pull_request:
    paths:
      - "tests/probe_xueqiu_browser.py"
      - ".github/workflows/xueqiu-linux-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-browser-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser_mode: [headless, headed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright==1.45.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
      - name: Probe one public profile and one timeline page
        shell: bash
        run: |
          if [[ "${{ matrix.browser_mode }}" == "headed" ]]; then
            xvfb-run -a python tests/probe_xueqiu_browser.py --mode headed
          else
            python tests/probe_xueqiu_browser.py --mode headless
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xueqiu-browser-${{ matrix.browser_mode }}
          path: artifacts/xueqiu_*.json
          if-no-files-found: warn
          retention-days: 3
