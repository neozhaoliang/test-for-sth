name: Investment Agent core tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/investment-agent-evidence-v2

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Linux one-click deployment script
        run: |
          bash -n deploy.sh
          grep -Fq 'http.version=HTTP/1.1' deploy.sh
          grep -Fq -- '--depth 1 --single-branch' deploy.sh
          grep -Fq 'setup_22.x' deploy.sh
          grep -Fq '127.0.0.1' deploy.sh
          grep -Fq 'ssh://git@ssh.github.com:443/' deploy.sh
          grep -Fq 'GIT_TRANSPORT="${GIT_TRANSPORT:-ssh}"' deploy.sh
          grep -Fq 'StrictHostKeyChecking=yes' deploy.sh
          grep -Fq 'GIT_SSH_COMMAND=' deploy.sh
          grep -Fq 'id_ed25519_investment_agent' deploy.sh
          grep -Fq 'APP_ARCHIVE=' deploy.sh
          grep -Fq 'install_local_zip' deploy.sh
          grep -Fq 'as_user rsync -a --checksum' deploy.sh
          grep -Fq 'lan-enable|lan-disable' deploy.sh
          grep -Fq 'INTRANET_ALLOWED_CIDRS' deploy.sh
          grep -Fq -- '--no-proxy-headers' deploy.sh
          ! grep -Fq -- '--host 0.0.0.0' deploy.sh
          ! grep -Fq 'StrictHostKeyChecking=no -o' deploy.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest pytest-asyncio uv \
            "pydantic>=2,<3" "pypdf>=5,<7" "fastapi>=0.115,<1" \
            akshare anthropic python-dotenv \
            "httpx[socks]==0.28.1" pillow playwright opencv-python tenacity requests

      - name: Verify uv lock is in sync
        run: uv lock --locked

      - name: Parse frozen uv lock for runtime install and export
        run: |
          uv --version
          uv export --frozen --offline --no-emit-project --output-file /tmp/locked-requirements.txt
          uv sync --frozen --dry-run --offline

      - name: Check lock compatibility with uv 0.10
        run: |
          python -m pip install --force-reinstall "uv==0.10.0"
          uv --version
          uv export --frozen --offline --no-emit-project --output-file /tmp/locked-requirements-0.10.txt
          uv sync --frozen --dry-run --offline

      - name: Compile investment-agent modules
        run: |
          python -m compileall -q \
            analysis/evidence.py \
            analysis/financial_consistency.py \
            analysis/reviewer.py \
            analysis/research_profile.py \
            analysis/management_capital.py \
            analysis/succession_risk.py \
            analysis/verified_governance_events.py \
            analysis/macro_rates.py \
            analysis/macro_verified_fallback.py \
            analysis/commodity.py \
            analysis/a_share_structure.py \
            analysis/valuation_history.py \
            analysis/valuation_engine.py \
            analysis/valuation_models.py \
            analysis/valuation_macro.py \
            analysis/valuation_orchestrator.py \
            analysis/investor_valuation.py \
            analysis/market_research_context.py \
            analysis/market_rotation.py \
            analysis/public_report.py \
            analysis/json_safety.py \
            analysis/issuer_business.py \
            analysis/valuation_config.py \
            analysis/valuation_assumptions.py \
            analysis/valuation_payout.py \
            analysis/chip_position.py \
            analysis/position_risk.py \
            analysis/investment_method_distiller.py \
            analysis/resource_mining_thesis.py \
            analysis/thesis_readability.py \
            analysis/dimension_readability.py \
            analysis/prose_integrity.py \
            analysis/chart_interpretation.py \
            analysis/resource_macro_transmission.py \
            analysis/macro_rates.py \
            analysis/rd_team.py \
            analysis/primary_sources.py \
            analysis/policy_context.py \
            analysis/candidates.py \
            analysis/shareholder.py \
            backtest/score.py \
            backtest/llm_client.py \
            analysis/report_contract.py \
            analysis/report_inputs.py \
            analysis/report_validation.py \
            analysis/research_context.py \
            analysis/snapshot_store.py \
            analysis/snapshot_replay.py \
            analysis/snapshot_compare.py \
            analysis/external_synthesis.py \
            analysis/report_blocks.py \
            analysis/report_synthesis.py \
            analysis/report_social.py \
            analysis/report.py \
            analysis/etf_discovery.py \
            analysis/etf_macro.py \
            analysis/etf_cycle.py \
            analysis/etf_data.py \
            analysis/etf_report.py \
            analysis/knowledge_base.py \
            analysis/knowledge_context.py \
            analysis/fundamentals.py \
            analysis/filing_calendar.py \
            analysis/filing_archive.py \
            analysis/historical_corpus.py \
            analysis/point_in_time_financials.py \
            analysis/point_in_time_ownership.py \
            analysis/point_in_time_shareholder.py \
            analysis/point_in_time_capital_returns.py \
            model/m_analysis.py \
            config/bilibili_config.py \
            media_platform/bilibili/client.py \
            media_platform/bilibili/core.py \
            store/bilibili/__init__.py \
            tools/live_public_acceptance.py \
            tools/live_report_acceptance.py \
            tools/live_historical_acceptance.py \
            tools/historical_research_input_acceptance.py \
            tools/historical_corpus_cli.py \
            tools/snapshot_cli.py \
            web/intranet_access.py \
            web/app.py \
            local_share.py

      - name: Check embedded WebUI JavaScript syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("web/app.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          html = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  if any(isinstance(t, ast.Name) and t.id == "_INDEX_HTML" for t in node.targets):
                      if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                          html = node.value.value
                          break
          if html is None:
              raise SystemExit("_INDEX_HTML not found")
          if "<script>" not in html or "</script>" not in html:
              raise SystemExit("inline script not found")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/investment-webui.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/investment-webui.js

      - name: Verify interactive dashboard sliders and charts
        run: node tests/check_dashboard_ui.js /tmp/investment-webui.js

      - name: Verify industry-specific valuation UI and no-target-price safeguards
        run: |
          node tests/check_industry_valuation_ui.js /tmp/investment-webui.js
          node tests/check_report_toc_ui.js /tmp/investment-webui.js
          node tests/check_verdict_figures_ui.js /tmp/investment-webui.js
          node tests/check_analysis_loading_ui.js /tmp/investment-webui.js
          node tests/check_style_returns_ui.js /tmp/investment-webui.js
          node --check web/stock_autocomplete.js
          node tests/check_stock_autocomplete_ui.js
          node tests/check_etf_price_only_ui.js

      - name: Verify ROE growth discount interactive valuation
        run: |
          node --check web/roe_discount.js
          node tests/check_roe_discount_ui.js

      - name: Run investment-agent unit/regression tests
        run: |
          pytest -q \
            tests/test_analysis_evidence.py \
            tests/test_analysis_reviewer.py \
            tests/test_research_profile.py \
            tests/test_report_blocks.py \
            tests/test_report_validation.py \
            tests/test_llm_refusal_handling.py \
            tests/test_research_context.py \
            tests/test_snapshot_store.py \
            tests/test_snapshot_compare.py \
            tests/test_external_synthesis.py \
            tests/test_valuation_history_asof.py \
            tests/test_valuation_engine.py \
            tests/test_valuation_industry_models.py \
            tests/test_investor_reference_style.py \
            tests/test_market_style_reasons.py \
            tests/test_style_enrichment.py \
            tests/test_market_rotation.py \
            tests/test_investor_return_decomposition.py \
            tests/test_roe_discount_valuation.py \
            tests/test_research_desk_theme.py \
            tests/test_stock_suggest.py \
            tests/test_etf_discovery.py \
            tests/test_etf_task_projection.py \
            tests/test_etf_quote_and_holdings.py \
            tests/test_etf_topic_isolation.py \
            tests/test_etf_macro_cycle.py \
            tests/test_etf_research.py \
            tests/test_company_valuation_knowledge.py \
            tests/test_public_report_privacy.py \
            tests/test_json_response_safety.py \
            tests/test_issuer_business.py \
            tests/test_issuer_capital_alignment.py \
            tests/test_valuation_config.py \
            tests/test_valuation_assumptions.py \
            tests/test_valuation_payout.py \
            tests/test_valuation_filing_join.py \
            tests/test_valuation_real_filings_2025.py \
            tests/test_chip_position.py \
            tests/test_position_risk.py \
            tests/test_investment_method_distiller.py \
            tests/test_resource_mining_thesis.py \
            tests/test_thesis_readability.py \
            tests/test_dimension_readability.py \
            tests/test_prose_integrity.py \
            tests/test_intranet_access.py \
            tests/test_local_share.py \
            tests/test_deploy_lan.py \
            tests/test_chart_interpretation.py \
            tests/test_resource_macro_transmission.py \
            tests/test_market_context_asof.py \
            tests/test_realtime_price_asof.py \
            tests/test_margin_asof.py \
            tests/test_knowledge_asof.py \
            tests/test_knowledge_context.py \
            tests/test_score_asof.py \
            tests/test_shareholder_asof.py \
            tests/test_fundamentals_consistency.py \
            tests/test_601919_consistency.py \
            tests/test_management_capital.py \
            tests/test_succession_risk.py \
            tests/test_macro_rates.py \
            tests/test_macro_verified_fallback.py \
            tests/test_commodity_cycle.py \
            tests/test_a_share_structure.py \
            tests/test_primary_sources.py \
            tests/test_filing_calendar.py \
            tests/test_filing_archive.py \
            tests/test_historical_corpus.py \
            tests/test_point_in_time_financials.py \
            tests/test_point_in_time_ownership.py \
            tests/test_point_in_time_shareholder.py \
            tests/test_point_in_time_capital_returns.py \
            tests/test_report_social_asof.py \
            tests/test_policy_context.py \
            tests/test_rd_team.py


  historical-e2e:
    name: Historical E2E acceptance
    needs: core-tests
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/investment-agent-evidence-v2') ||
      (github.event_name == 'pull_request' && github.head_ref == 'feature/investment-agent-evidence-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      BACKTEST_LLM_MODEL: ${{ vars.BACKTEST_LLM_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect LLM credentials
        id: llm
        shell: bash
        run: |
          if [ -n "$ANTHROPIC_AUTH_TOKEN" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Historical E2E: LLM credential is configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Historical E2E skipped: configure ANTHROPIC_AUTH_TOKEN or ANTHROPIC_API_KEY in repository Actions secrets."
          fi

      - name: Install project dependencies
        if: steps.llm.outputs.configured == 'true'
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked

      - name: Run strict historical E2E
        if: steps.llm.outputs.configured == 'true'
        run: |
          mkdir -p artifacts
          set -o pipefail
          uv run python -u tools/live_historical_acceptance.py \
            600036@2024-06-30 \
            601088@2023-06-30 \
            600519@2022-12-30 \
            --snapshot-root artifacts/investment_snapshots \
            | tee artifacts/historical-e2e.log

      - name: Write skipped marker
        if: steps.llm.outputs.configured != 'true'
        run: |
          mkdir -p artifacts
          printf '%s\n' \
            'Historical E2E was not executed because no Anthropic credential was available to GitHub Actions.' \
            'Configure ANTHROPIC_AUTH_TOKEN or ANTHROPIC_API_KEY in repository Actions secrets.' \
            > artifacts/HISTORICAL_E2E_SKIPPED.txt

      - name: Upload historical acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-e2e-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14


  historical-research-inputs:
    name: Historical research-input E2E (no LLM)
    needs: core-tests
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/investment-agent-evidence-v2') ||
      (github.event_name == 'pull_request' && github.head_ref == 'feature/investment-agent-evidence-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked

      - name: Run no-LLM historical research-input E2E
        id: probe
        continue-on-error: true
        run: |
          mkdir -p artifacts
          set -o pipefail
          uv run python -u tools/historical_research_input_acceptance.py \
            600036@2024-06-30 \
            --snapshot-root artifacts/research_input_snapshots \
            --output artifacts/historical-research-inputs.json \
            | tee artifacts/historical-research-inputs.log

      - name: Record research-input acceptance status
        if: always()
        run: |
          echo "outcome=${{ steps.probe.outcome }}" > artifacts/historical-research-inputs-status.txt

      - name: Upload research-input snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-research-inputs-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14


  historical-public-data:
    name: Historical public-data probe (${{ matrix.code }}@${{ matrix.as_of }})
    needs: core-tests
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/investment-agent-evidence-v2') ||
      (github.event_name == 'pull_request' && github.head_ref == 'feature/investment-agent-evidence-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - code: "600036"
            as_of: "2024-06-30"
          - code: "601088"
            as_of: "2023-06-30"
          - code: "600519"
            as_of: "2022-12-30"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked

      - name: Probe strict historical public data
        id: probe
        continue-on-error: true
        run: |
          mkdir -p artifacts
          set -o pipefail
          uv run python -u tools/historical_public_acceptance.py \
            "${{ matrix.code }}@${{ matrix.as_of }}" \
            --output "artifacts/historical-public-data-${{ matrix.code }}-${{ matrix.as_of }}.json" \
            --corpus-root "artifacts/historical_source_corpus" \
            | tee "artifacts/historical-public-data-${{ matrix.code }}-${{ matrix.as_of }}.log"

      - name: Record probe status
        if: always()
        run: |
          mkdir -p artifacts
          echo "outcome=${{ steps.probe.outcome }}" > "artifacts/status-${{ matrix.code }}-${{ matrix.as_of }}.txt"

      - name: Upload historical public-data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-public-data-${{ matrix.code }}-${{ matrix.as_of }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  dashboard-ui-tests:
    name: Interactive web dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract embedded JavaScript without importing backend
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path("web/app.py").read_text(encoding="utf-8"))
          html = next(n.value.value
            for n in tree.body
            if isinstance(n, ast.Assign)
            and any(isinstance(t, ast.Name) and t.id == "_INDEX_HTML" for t in n.targets)
            and isinstance(n.value, ast.Constant))
          assert '<script>' in html and '</script>' in html
          script = html.split('<script>',1)[1].split('</script>',1)[0]
          Path("/tmp/investment-dashboard.js").write_text(script,encoding="utf-8")
          PY
      - name: Check JavaScript syntax and model interaction
        run: |
          node --check /tmp/investment-dashboard.js
          node tests/check_dashboard_ui.js /tmp/investment-dashboard.js
          node tests/check_industry_valuation_ui.js /tmp/investment-dashboard.js
          node tests/check_report_toc_ui.js /tmp/investment-dashboard.js
          node tests/check_verdict_figures_ui.js /tmp/investment-dashboard.js
          node tests/check_analysis_loading_ui.js /tmp/investment-dashboard.js
          node tests/check_style_returns_ui.js /tmp/investment-dashboard.js
          node --check web/stock_autocomplete.js
          node tests/check_stock_autocomplete_ui.js
          node --check web/roe_discount.js
          node tests/check_roe_discount_ui.js
