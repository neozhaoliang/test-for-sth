name: Investment Agent live public-data acceptance

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Optional space-separated CODE:archetype cases"
        required: false
        default: ""

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run public-data acceptance matrix
        env:
          ACCEPTANCE_CASES: ${{ inputs.cases }}
        run: |
          if [ -n "$ACCEPTANCE_CASES" ]; then
            uv run python tools/live_public_acceptance.py $ACCEPTANCE_CASES
          else
            uv run python tools/live_public_acceptance.py
          fi

      - name: Explain scope
        if: always()
        run: |
          echo "This workflow validates public-data plumbing only."
          echo "It intentionally does not require Xueqiu login and does not call the LLM."
