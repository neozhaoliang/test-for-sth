name: Docker Xueqiu server static and unit checks

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "tools/docker-entrypoint.sh"
      - "tools/xueqiu_server_login.py"
      - "media_platform/xueqiu/**"
      - "config/base_config.py"
      - "tests/test_xueqiu_server_mode.py"
      - ".github/workflows/xueqiu-server-check.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "tools/docker-entrypoint.sh"
      - "tools/xueqiu_server_login.py"
      - "media_platform/xueqiu/**"
      - "config/base_config.py"
      - "tests/test_xueqiu_server_mode.py"
      - ".github/workflows/xueqiu-server-check.yml"

permissions:
  contents: read

jobs:
  server-mode-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate shell entrypoint and Python modules
        run: |
          bash -n tools/docker-entrypoint.sh
          python -m py_compile media_platform/xueqiu/client.py media_platform/xueqiu/core.py config/base_config.py tools/xueqiu_server_login.py
          test "$(head -n 1 Dockerfile)" = "FROM private-registry.sohucs.com/nvidia/cuda:11.8.0-cudnn-devel-python3.10-torch2.3.1-ubuntu22.04-ssh"
          grep -qx '.env' .dockerignore
          grep -qx 'browser_data/' .dockerignore
          grep -q 'USER investment' Dockerfile
          grep -q 'XUEQIU_SERVER_MODE=1' Dockerfile
          grep -q 'PLAYWRIGHT_BROWSERS_PATH=' Dockerfile
      - name: Install locked project dependencies
        run: |
          python -m pip install uv==0.10.0 pytest pytest-asyncio
          uv sync --frozen --python 3.11
      - name: Test Xueqiu logged-in second-page and session detection
        run: uv run --no-sync pytest -q tests/test_xueqiu_server_mode.py
